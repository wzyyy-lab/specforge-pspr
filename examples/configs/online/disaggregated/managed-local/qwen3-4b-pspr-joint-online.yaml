model:
  target_model_path: /kl_infra_infer_intern/wangzhuoyu/TAPS-SP/models/Qwen3-4B
  draft_model_config: configs/qwen3-4b-pspr-joint.json
  # Stage 2 starts from the stage-1 selector fused onto the released DFlash backbone. Rebuild it with
  #   PYTHONPATH=. python scripts/import_pspr_selector.py \
  #       --selector outputs/pspr_dh2048_exact/best.pt \
  #       --draft-config configs/qwen3-4b-pspr-joint.json --output-dir outputs/pspr_joint_init
  # A randomly initialised selector produces no useful gradient for the backbone, so training both
  # from scratch spends the backbone's budget being dragged by a head that has not learned yet.
  draft_checkpoint_path: ./outputs/pspr_s1_step2000_init
  # Online capture requires the sglang backend; the server must be the spec-capture patched build.
  target_backend: sglang
  embedding_key: model.embed_tokens.weight
  torch_dtype: bfloat16
  mask_token_id: 151669
  # data.max_length + headroom for the capture server's own context budget.
  sglang_context_length: 3200

data:
  # Online: exactly one of train_data_path / prompts_path / hidden_states_path. hidden_states_path is
  # the offline switch (schema.py:964-966 keys `mode` off it) and must stay absent here.
  # 200k rows sampled from open-perfectblend proportionally over its 8 sources, restricted to
  # trainable rows; see scripts/sample_perfectblend.py.
  # Regenerated by the target itself at temperature 0, so every supervised token is one Qwen3-4B
  # actually emits under the greedy protocol the evaluation uses. The raw corpus measured
  # P(target greedy == corpus next token) = 0.7302 (scripts/measure_label_mismatch.py), i.e. 27% of
  # the supervision taught tokens the target never emits, and the previous run's gsm8k oneshot fell
  # 6.040 -> 4.396 while the corpus-label train/acc rose 0.284 -> 0.458 -- the two metrics moved in
  # opposite directions. The official same-target recipe
  # (online/.../external/qwen3-4b-dflash-online.yaml) points at exactly this `_regen` artefact.
  train_data_path: ./cache/dataset/perfectblend_qwen3-4b_regen.jsonl
  # p99 of the sampled corpus is 3110 tokens, so this truncates under 1% of rows.
  max_length: 3072
  # NOT "qwen": that template carries system_prompt="You are a helpful assistant.", which
  # parse.py:211-212 prepends as a system turn to every training sequence. The evaluation harness
  # (TAPS-SP/scripts/decode_lattice.py:347) builds its prompt with apply_chat_template on a bare user
  # message and emits no system turn, so "qwen" trains the draft on a prefix it never sees at decode
  # time. "qwen-nosys" is identical except system_prompt=None, which makes the rendered sequence
  # byte-identical to the tokenizer's own template with the loss mask unchanged.
  chat_template: qwen-nosys
  cache_dir: ./cache
  build_dataset_num_proc: 32

training:
  strategy: dflash
  # Producer prompt passes. This is the ONLY knob controlling how many times the 200k rows are seen:
  # the consumer walks a single consume-once stream and never replays it as a trainer epoch
  # (runtime/ARCHITECTURE.md:29-33).
  # 6 passes matches the official qwen3-4b-dflash recipe's num_epochs -- but that recipe trains from
  # scratch. Both halves of this model are already converged, so 1 pass is the horizon: it is also
  # what makes the pilot meaningful, because `warmup_ratio` below is a FRACTION of total_steps. At
  # 6 passes (42705 steps) warmup alone is 1708 steps, so a 400-step pilot would never reach the
  # configured rate and could not falsify anything about it. At 1 pass (7117 steps) warmup is 285
  # steps and a 400-step pilot measures the real rate.
  #
  # S2 (this arm) raises 1 -> 3. S1 ran 1 pass with the backbone throttled to 3e-5 and measured
  # six-domain macro 5.7217 -> 6.0523 (step 1000) -> 6.1565 (step 2000); a log fit on those two
  # post-warmup points projects 6.347 at 7117 steps, i.e. SHORT of the official Domino 6.4255. The
  # cause is budget, not modelling: the official domino recipe
  # (examples/configs/online/disaggregated/external/qwen3-8b-domino-online.yaml) trains its WHOLE
  # model at learning_rate 6.0e-4 for num_epochs 6, so S1's backbone ran at roughly 1/120 of the
  # opponent's optimizer budget. The two alternative levers were measured and rejected: the gate is
  # saturated (sweeping rho over {3,2,1,0.5} x theta {0,0.35} on S1's step-1000 checkpoint moved
  # gsm8k only 7.625 -> 7.663, and every theta=0.35 cell was worse), and top-K recall at the frontier
  # is already 0.92-0.93, so the candidate set is not the constraint either. That leaves the backbone.
  num_epochs: 3
  # max_steps is deliberately unset. Setting it suppresses the schedule sidecar the producer writes,
  # which is what gives an exact `total_steps = num_prompts * num_epochs / (dp*bs*accum)` horizon
  # (training/schedule.py:64-68). With dp=7, bs=2, accum=2 the quantum is 28.
  batch_size: 2
  # accum 2 -> global batch 28, close to the official qwen3-4b-dflash 8x4x1 = 32. The previous
  # accum 8 gave global 112 -- 3.5x the official batch at the same 6e-4 head rate, with only 5355
  # optimizer updates against the official 10000. Total compute per pass is unchanged; this only
  # trades one large update for four smaller ones.
  accumulation_steps: 2
  # Official dp7 recipes pin this; the default SHARD_GRAD_OP is not what they run.
  fsdp_sharding: "NO_SHARD"
  # Single effective rate would be what the official domino recipe does (no lr_scale_rules, whole
  # model at 6.0e-4). S2 tried exactly that and was falsified; see the Optimizer note. This is
  # therefore the SELECTOR's rate, and the backbone is scaled to 0.05x = 3e-5 by the catch-all below.
  learning_rate: 6.0e-4
  warmup_ratio: 0.04
  max_grad_norm: 1.0
  attention_backend: flex_attention
  # Official dflash recipes (8b and 27b) both use 512; only the domino recipe uses 256.
  num_anchors: 512
  # --- Acceptance-length objective ---------------------------------------------------------------
  # Both knobs are what the official DFlash2 recipe runs, and both target expected accept length
  # directly instead of through a proxy. EXPERIMENT_LOG.md:1548 already recorded that the stage-1
  # ablations against them do NOT transfer to joint training -- with the backbone frozen these two
  # only reweight selector positions, and the D-PACE weights (which are a function of the backbone's
  # own target_probability) are static. That note was not acted on; this is it.
  #
  # loss_type dpace: prefix = cumprod((1-a)*q + a) is P(every slot up to i accepted), and
  # suffix = reverse_cumsum(prefix) is therefore exactly d/d(slot i) of E[L] = sum_i prefix[i].
  # The weight per slot IS that slot's marginal contribution to accept length, and it adapts as the
  # backbone improves. `loss_decay_gamma` below is a fixed exp(-i/7) that ignores how the model is
  # actually doing; note it is READ ONLY under loss_type "dflash" (dflash_family_model.py:673-682),
  # so under dpace it is an inert no-op kept only to make a revert one line.
  loss_type: dpace
  # lk_loss_type lambda: tv_num = sum (1 - q(target)) * w, which under DFlash's hard targets is
  # literally 1 - acceptance probability. CE optimises log q and its gradient vanishes where q is
  # already near 1; accept length is a function of q itself, not of log q. `lambda` blends the two
  # by the current mean acceptance, kl_weight = exp(-acceptance), so it is CE-dominated while the
  # draft is weak and TV-dominated once it is strong. Verified this composes safely with dpace:
  # the acceptance ratio is fed accuracy_denom = weight_mask.sum() (dflash_family_model.py:891),
  # NOT the D-PACE-weighted loss_den, so the D-PACE weights cannot deflate the TV term.
  # Costs no new supervision: both terms read only target_ids, which online capture already carries.
  lk_loss_type: lambda
  loss_decay_gamma: 7.0

  # --- Optimizer -------------------------------------------------------------------------------
  # TWO effective rates: selector at `learning_rate`, backbone at 0.05x of it.
  #
  # S1 ran a differential rate: `{"": 0.05}` put the backbone at 3e-5 while the selector kept 6e-4.
  # S2 removed the throttle (all groups 1.0, whole model at 6e-4, matching the official domino
  # recipe) and was FALSIFIED at step 2000. The damage is domain-specific catastrophic forgetting,
  # invisible on the domain the pilot happened to use:
  #
  #   domain     step0   S1@2000 (3e-5)   S2@2000 (6e-4)
  #   gsm8k      6.813   7.972            7.954
  #   math500    8.139   8.697            8.199
  #   humaneval  6.676   6.935            6.390   <- BELOW the released backbone's own level
  #   mbpp       6.399   6.779            6.165   <- BELOW the released backbone's own level
  #   alpaca     2.959   3.030            2.959
  #   mt-bench   3.344   3.526            3.373
  #   MACRO      5.7217  6.1565           5.8400
  #
  # The frontier top-K recall guard fired too: 0.8592 aggregated over the six domains against the
  # 0.9192 baseline, i.e. -0.060 against a -0.020 stop threshold. So 6e-4 deletes the candidates the
  # selector has to choose among, on exactly the domains the training corpus under-covers.
  #
  # S3 (this arm) therefore restores 0.05 and spends the budget on `num_epochs` instead: at 3e-5
  # every one of the six domains rose monotonically (step0 < step1000 < step2000, no exception), so
  # the rate is empirically forgetting-free and the horizon is the lever with no damage mechanism.
  #
  # Matching is longest-prefix, so the order written here is for readability only: assembly.py:277
  # sorts by descending prefix length before the optimizer sees the rules (optimizer.py's matcher
  # itself returns on first hit, which is exactly why that sort exists). The catch-all must be
  # written as `""` -- PSPRDraftModel's backbone tensors are named `layers.*`, `norm.*`, `fc.*`,
  # `hidden_norm.*` with NO `model.` prefix, so the intuitive `{"model.": 0.05}` silently matches
  # nothing and would leave the backbone at the full rate.
  #
  # gamma deliberately does NOT get the dh2048 recipe's 5x. That multiplier exists because gamma
  # starts at 0 and must travel to ~1 before the head does anything; ours warm-starts at 0.6902.
  lr_scale_rules:
    "candidate_selector.gamma": 1.0
    "candidate_selector.": 1.0
    "": 0.05
  # Backbone decay stays at the official recipes' 0; the selector keeps the 2e-3 it was trained
  # under in stage-1, and gamma is exempt (decay on a single gain that anchors the head's strength
  # pulls it back toward the no-op point). First match wins here too.
  weight_decay: 0.0
  weight_decay_rules:
    "candidate_selector.gamma": 0.0
    "candidate_selector.predecessor_codebook": 0.0
    "candidate_selector.successor_codebook": 0.0
    "candidate_selector.": 2.0e-3

  # --- Selector objective ------------------------------------------------------------------------
  # Selector/error numerators share the globally reduced base denominator. This is invariant to
  # the 7-rank x 2-microbatch partition; local selector/frontier means are not.
  dflash2_selector_loss_alpha: 1.0
  dflash2_selector_err_loss_alpha: 1.0
  # Must remain false under DDP/gradient accumulation; tune the two alpha values for relative scale.
  dflash2_selector_own_denominator: false
  # Weight the selector's CE per covered slot UNIFORMLY, not by the base objective's weights.
  #
  # This is not cosmetic. Under `loss_type: dpace` the base objective's `loss_weights` is
  # `weight_mask * dpace_weights` (dflash_family_model.py:687-693), and the selector CE used to
  # inherit it. Stage-1 trains under a plain mean CE over covered slots
  # (scripts/train_pspr_accept_selector.py), so loading the stage-1 checkpoint into the old default
  # changed the objective its weights were optimal for at the exact moment of the warm start -- which
  # is the one thing a warm start exists to prevent. `uniform` makes stage-2's selector loss
  # numerically identical to stage-1's (verified exactly by scripts/gate_pspr_selector_weight_mode.py
  # W3 for a single batch). The globally aggregated objective intentionally shares the base
  # denominator; selector_loss telemetry remains the global selector numerator/support ratio.
  #
  # This changes only the SELECTOR's weighting. The backbone keeps full D-PACE, which is the point of
  # having a separate knob rather than reverting loss_type to "dflash".
  dflash2_selector_weight_mode: uniform
  dflash2_selector_warmup_ratio: 0.0
  dflash2_selector_ramp_ratio: 0.0
  # MUST be false: stopping the gradient at the unary/backbone boundary is exactly what would make
  # the selector objective invisible to the backbone. This flag IS the "joint" in joint training.
  dflash2_selector_stop_gradient: false
  # MUST be false on online. The streaming FeatureContract declares no optional tensors and the
  # capture layout passes through only input_ids/loss_mask, so `target_greedy` can never arrive and
  # enabling this raises at dflash_family_model.py:783-789. The recipe supervises the selector on the
  # committed continuation anyway.
  dflash2_selector_target_greedy_labels: false

  # A crashed run can recover the consumer but cannot rewind the producer, so checkpoint often.
  # 200 is chosen from evidence, not habit: iteration AG's one-shot collapse was already fully
  # visible at step 200 (6.040 -> 4.374), so this is the interval at which the pilot's decisive
  # measurement exists -- and S2 raises the backbone rate 20x, which is exactly when that pilot
  # matters most. Three passes at 21352 steps emits 107 checkpoints at 7.9 GB each (~845 GB) against
  # 32 TB free; stale ones are pruned by hand once a later checkpoint has been shown to dominate.
  save_interval: 200
  log_interval: 10
  dist_timeout: 30
  seed: 42

tracking:
  report_to: tensorboard

runtime:
  # One HTTP capture call batches this many prompts; at ~14.7 MiB/sample (573 tokens mean) a lease of
  # 8 stages ~118 MiB, well inside the 2 GiB local buffer.
  producer_lease: 8
  # Two capture calls in flight against the single server; cheaper than adding a second server.
  producer_concurrency: 2
  # Both watermarks must be >= the 112-sample quantum or startup raises (disaggregated.py:244-257).
  # 256 refs is ~3.8 GB resident, far inside the 32 GiB segment.
  in_flight_high_watermark: 256
  in_flight_low_watermark: 192

run_id: qwen3-4b-pspr-joint-online
output_dir: ./outputs/qwen3-4b-pspr-joint-online

deployment:
  mode: disaggregated
  trainer:
    nnodes: 1
    nproc_per_node: 7
  disaggregated:
    control_dir: outputs/qwen3-4b-pspr-joint-online/control
    consumer_state_dir: outputs/qwen3-4b-pspr-joint-online/consumer-state
    backend: mooncake
    managed_local:
      # GPU 0 captures, GPU 1-7 train: the layout both official 8-card dp7 recipes use.
      trainer_cuda_visible_devices: ["1", "2", "3", "4", "5", "6", "7"]
      mooncake:
        # No RDMA on this host; tcp is the default in all three places SpecForge sets it.
        protocol: tcp
        global_segment_size_bytes: 34359738368
        # 2 GiB rather than the usual 1: producer_lease x per-sample bytes stages through here.
        local_buffer_size_bytes: 2147483648
        # Left at the 500ms default. The dflash2 recipe's 5000 only shrinks the teardown drain's
        # margin against Mooncake's read lease and buys nothing for a long run.
      capture_servers:
        - port: 30000
          cuda_visible_devices: ["0"]
          tp_size: 1
          mem_fraction_static: 0.5
